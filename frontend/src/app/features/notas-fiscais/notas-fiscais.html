<div class="screen-title-row">
  <h2>Notas fiscais</h2>
  <button type="button" (click)="novaNota()">+ Nova nota fiscal</button>
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>Número</th>
        <th>Status</th>
        <th>Itens</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let nota of notas()">
        <td class="mono">{{ nota.numero }}</td>
        <td>
          <span class="stamp" [class.stamp-open]="nota.status === 'Aberta'" [class.stamp-closed]="nota.status === 'Fechada'">
            {{ nota.status }}
          </span>
        </td>
        <td class="mono">{{ nota.quantidadeItens }}</td>
        <td class="actions"><a [routerLink]="['/notas-fiscais', nota.id]">Ver</a></td>
      </tr>
    </tbody>
  </table>
</div>
