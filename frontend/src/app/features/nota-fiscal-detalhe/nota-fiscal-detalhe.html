<a class="voltar-link" routerLink="/notas-fiscais">Voltar para notas fiscais</a>

<div *ngIf="nota() as notaAtual" class="card invoice-card">

  <div class="invoice-head">
    <div>
      <p class="invoice-label">Nota fiscal nº</p>
      <p class="invoice-number">{{ notaAtual.numero }}</p>
    </div>
    <span class="stamp stamp-lg"
          [class.stamp-open]="notaAtual.status === 'Aberta'"
          [class.stamp-closed]="notaAtual.status === 'Fechada'">
      {{ notaAtual.status }}
    </span>
  </div>

  <table>
    <thead>
      <tr>
        <th>Produto</th>
        <th>Quantidade</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of notaAtual.itens">
        <td>{{ item.descricaoProduto }}</td>
        <td class="mono">{{ item.quantidade }}</td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="notaAtual.status === 'Aberta'">

    <form class="add-item-row" (ngSubmit)="adicionarItem()">
      <label class="field field-inline">
        <span>Produto</span>
        <select name="produto" [(ngModel)]="produtoSelecionadoId" required>
          <option value="" disabled>Selecione um produto</option>
          <option *ngFor="let produto of produtos()" [value]="produto.id">
            {{ produto.codigo }} — {{ produto.descricao }} (saldo: {{ produto.saldo }})
          </option>
        </select>
      </label>

      <label class="field field-qty">
        <span>Qtd.</span>
        <input type="number" name="quantidade" [(ngModel)]="quantidade" min="1" required>
      </label>

      <button type="submit" class="btn-ghost">+ Adicionar item</button>
    </form>

    <div class="invoice-foot">
      <p class="invoice-total">{{ notaAtual.itens.length }} {{ notaAtual.itens.length === 1 ? 'item' : 'itens' }} nesta nota</p>
      <button type="button" class="btn-print" (click)="imprimir()" [disabled]="imprimindo()">
        {{ imprimindo() ? 'Processando...' : 'Imprimir nota fiscal' }}
      </button>
    </div>

  </div>

  <p *ngIf="mensagemErro" class="erro-msg">{{ mensagemErro }}</p>

</div>
