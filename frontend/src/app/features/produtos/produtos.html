<h2>Produtos</h2>

<div class="screen-grid">

  <form class="card" (ngSubmit)="salvarProduto()">
    <h3>Novo produto</h3>

    <label class="field">
      <span>Código</span>
      <input type="text" name="codigo" [(ngModel)]="novoCodigo" required>
    </label>

    <label class="field">
      <span>Descrição</span>
      <input type="text" name="descricao" [(ngModel)]="novaDescricao" required>
    </label>

    <label class="field">
      <span>Saldo inicial</span>
      <input type="number" name="saldo" [(ngModel)]="novoSaldo" required min="0">
    </label>

    <button type="submit">Salvar produto</button>

    <p *ngIf="mensagemErro" class="erro-msg">{{ mensagemErro }}</p>
  </form>

  <div class="card">
    <h3>Produtos cadastrados</h3>
    <table *ngIf="produtos$ | async as produtos">
      <thead>
        <tr>
          <th>Código</th>
          <th>Descrição</th>
          <th>Saldo</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let produto of produtos">
          <td>{{ produto.codigo }}</td>
          <td>{{ produto.descricao }}</td>
          <td>{{ produto.saldo }}</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
